.count{color:var(--muted);font-size:13px;margin-top:5px}

.sort-btn{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
.sort-btn:hover{color:var(--text)}

.game-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}

.game-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.game-card:hover .game-cover img{transform:scale(1.045)}

.game-name{min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;padding:13px 15px;font-size:15px;font-weight:800;line-height:1.35;border-top:1px solid rgba(255,255,255,.05);unicode-bidi:plaintext}

.empty h2{color:var(--text);font-size:19px;margin:0 0 8px}
.empty p{margin:0;font-size:14px}

.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top:hover{border-color:var(--accent);color:var(--accent)}

  {n:"Mario Kart 8 Deluxe", i:"Mario Kart 8 Deluxe (NSP).jpg"},
  {n:"Mario Party Superstars", i:"Mario Party Superstars.jpg"},
  {n:"Mario Strikers: Battle League", i:"mario_strikers_battle_league.xci.jpg"},
  {n:"Minecraft", i:"Minecraft.webp"},
  {n:"Need for Speed Hot Pursuit Remastered", i:"Need for Speed Hot Pursuit Remastered.jpg"},
  {n:"New Super Mario Bros. U Deluxe", i:"New Super Mario Bros. U Deluxe.nsp.jpg"},
  {n:"Nintendo Switch Sports", i:"Nintendo Switch Sports.jpg"},
  {n:"Pokemon Violet", i:"Pokemon Violet.jpg"},
  {n:"RAYMAN LEGENDS DEFINITIVE EDITION", i:"RAYMAN LEGENDS DEFINITIVE EDITION.jpg"},
  {n:"SMURFS KART", i:"SMURFS KART.jpg"},
  {n:"Sniper Elite 4", i:"Sniper Elite 4.jpg"},
  {n:"SONIC SUPERSTARS Digital Deluxe Edition", i:"SONIC SUPERSTARS Digital Deluxe Edition.jpg"},
  {n:"Splatoon 3", i:"Splatoon 3.jpg"},
  {n:"SUPER MARIO ODYSSEY", i:"SUPER MARIO ODYSSEY.jpg"},
  {n:"Super Mario 3D World + Bowser's Fury", i:"Super Mario 3D World + Bowser's Fury.webp"},
  {n:"Super Mario Bros. Wonder", i:"Super Mario Bros. Wonder.jpg"},
  {n:"Super Mario Party Jamboree", i:"Super Mario Party Jamboree.jpg"},
  {n:"Tennis World Tour 2", i:"Tennis World Tour 2.jpg"},
  {n:"The Legend of Zelda: Tears of the Kingdom", i:"The Legend of Zelda Tears of the Kingdom.jpg"},
  {n:"Yoshi's Crafted World", i:"Yoshi's Crafted World.nsp.jpg"}
];

/* ---- أدوات ---- */
const $ = id => document.getElementById(id);
const grid = $('grid'), empty = $('empty'), countEl = $('count'), searchEl = $('search');

const norm = s => s.toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9\u0600-\u06ff]+/g,'');

const words = s => s.toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9\u0600-\u06ff]+/g,' ')
  .trim().split(' ').filter(Boolean);

/* اختصارات البحث */
const ALIASES = [
  [/grand theft auto/i,            "gta قراند جاتا"],
  [/call of duty/i,                "cod كود كول اوف ديوتي"],
  [/\bfc\s?2\d|fifa/i,             "fifa فيفا"],
  [/need for speed/i,              "nfs نيد فور سبيد"],
  [/god of war/i,                  "gow جود اوف وور"],
  [/assassin/i,                    "ac اساسنز كريد"],
  [/mortal kombat/i,               "mk مورتال كومبات"],
  [/resident evil/i,               "re ريزيدنت ايفل"],
  [/spider-?man/i,                 "سبايدرمان سبايدر مان"],
  [/last of us/i,                  "tlou لاست اوف اس"],
  [/red dead/i,                    "rdr ريد ديد"],
  [/battlefield/i,                 "bf باتلفيلد"],
  [/street fighter/i,              "sf ستريت فايتر"],
  [/tekken/i,                      "تيكن"],
  [/minecraft/i,                   "ماين كرافت"],
  [/far cry/i,                     "فار كراي"],
  [/naruto/i,                      "ناروتو"],
  [/dragon ball/i,                 "dbz دراغون بول"],
  [/one piece/i,                   "ون بيس"],
  [/\bwwe\b/i,                     "مصارعة"],
  [/formula|\bf1\b/i,              "f1 فورمولا"],
  [/gran turismo/i,                "gt جران توريزمو"],
  [/watch dogs/i,                  "watchdogs ووتش دوقز"],
  [/uncharted/i,                   "انشارتد"],
  [/batman/i,                      "باتمان"],
  [/mario/i,                       "ماريو"],
  [/zelda/i,                       "زيلدا"],
  [/pokemon/i,                     "بوكيمون"],
  [/sonic/i,                       "سونيك"],
  [/hitman/i,                      "هيتمان"],
  [/overcooked/i,                  "اوفركوكد"],
  [/lego/i,                        "ليغو"],
  [/\bps2\s?to\s?ps4|\[PS2toPS4\]/i, "ps2 بلايستيشن2"],
];

[...GAMES, ...SWITCH].forEach(g => {
  let k = norm(g.n) + norm((g.l||[]).map(x => x[0]).join(' '));
  if (g.ar) k += norm('arabe arabic') + 'عربية';
  for (const [re, extra] of ALIASES) if (re.test(g.n)) k += norm(extra);
  g._k = k;
});

const LOCS = [...new Set(GAMES.flatMap(g => (g.l||[]).map(x => x[0])))];
GAMES.forEach(g => { const f = g.l && g.l[0] ? LOCS.indexOf(g.l[0][0]) : -1; g.o = f < 0 ? 999 : f; });

const matches = (g, q, qw) => g._k.includes(q) || qw.every(w => g._k.includes(w));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PLATFORMS = {
  ps4:    { list: GAMES,  title: 'ألعاب PS4',             sub: 'كتالوج ألعاب PS4' },
  switch: { list: SWITCH, title: 'ألعاب Nintendo Switch', sub: 'كتالوج ألعاب Nintendo Switch' }
};
let platform = 'ps4', sortMode = 'az', locFilter = '', onlyAr = false;

/* ---- الرسم ---- */
const EXT = ['.jpg','.png','.jpeg','.webp','.JPG','.PNG','.avif'];
const hasExt = f => /\.(png|jpe?g|webp|avif|gif)$/i.test(f);
/* قائمة الامتدادات المحتملة: الملف المذكور أولاً ثم بقية الصيغ (jpg / png / webp ...) */
function srcList(i){
  const base = i.replace(/\.(png|jpe?g|webp|avif|gif)$/i, '');
  const list = hasExt(i) ? [i] : [];
  EXT.forEach(e => { const f = base + e; if (!list.includes(f)) list.push(f); });
  return list;
}
function imgFail(el){
  const list = srcList(el.dataset.i || '');
  const n = (+el.dataset.t || 0) + 1;
  if (n < list.length){ el.dataset.t = n; el.src = './icon_games/' + list[n]; return; }
  el.parentNode.classList.add('no-img');
}

function cardHTML(g){
  const cover = g.i
    ? `<div class="game-cover"><img src="./icon_games/${esc(srcList(g.i)[0])}" data-i="${esc(g.i)}" data-t="0" alt="${esc(g.n)}" loading="lazy" decoding="async" onerror="imgFail(this)"></div>`
    : `<div class="game-cover no-img"></div>`;
  const isArabic = g.ar ? `<span class="badge badge-ar">عربية</span>` : '';
  const mixed = g.l && g.l.some(x => x[1]) && g.l.some(x => !x[1]);
  let loc = '';
  if (platform === 'ps4'){
    loc = g.l && g.l.length
      ? `<div class="game-loc">📀 ${g.l.map(x => `<span>${esc(x[0])}${mixed && x[1] ? ' · عربية' : ''}</span>`).join('')}</div>`
      : `<div class="game-loc none">📀 —</div>`;
  }
  return `<article class="game-card">${cover}${isArabic}<div class="game-name" dir="auto">${esc(g.n)}</div>${loc}</article>`;
}

const byName = (a,b) => a.n.localeCompare(b.n,'en',{sensitivity:'base'});

function render(){
  const all = PLATFORMS[platform].list;
  const q = norm(searchEl.value), qw = words(searchEl.value);
  let list = all.filter(g =>
    (!q || matches(g, q, qw)) && (!locFilter || (g.l||[]).some(x => x[0] === locFilter)) && (!onlyAr || g.ar));

  if (sortMode === 'ar')       list.sort((a,b) => (b.ar||0)-(a.ar||0) || byName(a,b));
  else if (sortMode === 'loc') list.sort((a,b) => a.o - b.o || byName(a,b));
  else                         list.sort(byName);

  grid.innerHTML = list.map(cardHTML).join('');
  empty.classList.toggle('show', list.length === 0);

  const filtered = q || locFilter || onlyAr;
  countEl.innerHTML = filtered
    ? `<b>${list.length}</b> نتيجة من أصل ${all.length} لعبة`
    : `<b>${all.length}</b> لعبة متوفّرة`;

  $('searchWrap').classList.toggle('filled', searchEl.value !== '');
}

/* ---- الأحداث ---- */
searchEl.addEventListener('input', render);
searchEl.addEventListener('keydown', e => { if(e.key === 'Escape'){ searchEl.value=''; render(); } });
$('searchClear').addEventListener('click', () => { searchEl.value=''; render(); searchEl.focus(); });

function setSort(mode){
  sortMode = mode;
  $('sortAz').setAttribute('aria-pressed',  mode === 'az');
  $('sortAr').setAttribute('aria-pressed',  mode === 'ar');
  $('sortLoc').setAttribute('aria-pressed', mode === 'loc');
  render();
}
$('sortAz').addEventListener('click',  () => setSort('az'));
$('sortAr').addEventListener('click',  () => setSort('ar'));
$('sortLoc').addEventListener('click', () => setSort('loc'));

$('onlyAr').addEventListener('click', () => {
  onlyAr = !onlyAr;
  $('onlyAr').setAttribute('aria-pressed', onlyAr);
  render();
});

const locSel = $('locSel');
locSel.innerHTML = '<option value="">📀 كل الأماكن</option>' +
  LOCS.map(l => `<option value="${esc(l)}">${esc(l)} (${GAMES.filter(g => (g.l||[]).some(x => x[0] === l)).length})</option>`).join('');
locSel.addEventListener('change', () => { locFilter = locSel.value; render(); });

function setPlatform(p){
  platform = p;
  $('platPs4').setAttribute('aria-pressed', p === 'ps4');
  $('platSw').setAttribute('aria-pressed',  p === 'switch');
  $('pageTitle').textContent = PLATFORMS[p].title;
  $('brandSub').textContent  = PLATFORMS[p].sub;
  document.querySelectorAll('.ps4-only').forEach(el => { el.hidden = (p !== 'ps4'); });
  locFilter = ''; locSel.value = '';
  onlyAr = false; $('onlyAr').setAttribute('aria-pressed', false);
  setSort('az');
}
$('platPs4').addEventListener('click', () => setPlatform('ps4'));
$('platSw').addEventListener('click',  () => setPlatform('switch'));

document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
});

const toTop = $('toTop');
addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > 600), {passive:true});
toTop.addEventListener('click', () => scrollTo({top:0, behavior:'smooth'}));

/* ---- الإقلاع ---- */
$('nPs4').textContent = '(' + GAMES.length + ')';
$('nSw').textContent  = '(' + SWITCH.length + ')';
$('footCount').textContent = 'PS4: ' + GAMES.length + ' لعبة • Nintendo Switch: ' + SWITCH.length + ' لعبة';
render();
</script>

<script>
/* احتياط الشعارات */
function logoFail(el){
  const exts = ['.png','.PNG','.jpg','.JPG','.jpeg','.webp'];
  const n = +el.dataset.t || 0;
  if (el.dataset.base && n < exts.length){
    el.dataset.t = n + 1;
    el.src = el.dataset.base + exts[n];
    return;
  }
  el.onerror = null;
  let sub;
  if (el.dataset.fb === 'icon'){
    sub = document.createElement('div');
    sub.className = 'brand-icon';
    sub.textContent = '🎮';
  } else if (el.classList.contains('soon-logo')){
    sub = document.createElement('span');
  } else {
    sub = document.createElement('span');
    sub.className = 'logo-txt';
    sub.textContent = el.alt;
  }
  el.replaceWith(sub);
}
</script>

<script>
/* تبويب PS5 (قريباً) */
(function(){
  const $ = id => document.getElementById(id);
  const hideWhenSoon = ['grid','empty','count','searchWrap'].map($)
    .concat([document.querySelector('.filters')]);
  function setSoon(on){
    hideWhenSoon.forEach(el => { if (el) el.hidden = on; });
    $('soon').hidden = !on;
    $('platPs5').setAttribute('aria-pressed', on);
    if (on){
      $('platPs4').setAttribute('aria-pressed', false);
      $('platSw').setAttribute('aria-pressed', false);
      $('pageTitle').textContent = 'ألعاب PS5';
      $('brandSub').textContent  = 'ألعاب PS5 متوفرة قريباً';
    }
  }
  $('platPs5').addEventListener('click', () => setSoon(true));
  $('platPs4').addEventListener('click', () => setSoon(false));
  $('platSw').addEventListener('click',  () => setSoon(false));
})();
</script>
</body>
</html>
