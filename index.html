<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GAME SHOP ORAN | ألعاب PS4 و Nintendo Switch</title>
<meta name="description" content="GAME SHOP ORAN — كتالوج ألعاب PS4 و Nintendo Switch.">
<meta name="theme-color" content="#070a10">
<meta property="og:title" content="GAME SHOP ORAN | ألعاب PS4 و Nintendo Switch">
<meta property="og:description" content="كتالوج ألعاب PS4 و Nintendo Switch.">
<meta property="og:type" content="website">
<meta property="og:image" content="./logos/logo.jpg">
<link rel="apple-touch-icon" href="./logos/logo.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%AE</text></svg>">
<style>
:root{
  --bg:#070a10; --card:#111823; --line:#202b3a; --text:#f4f7fb; --muted:#9ba8ba;
  --accent:#35e0a1; --accent2:#6d7cff; --radius:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--text); font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(109,124,255,.12),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(53,224,161,.08),transparent 28%),
    var(--bg);
  min-height:100vh;
}

/* ---------- الرأس ---------- */
.header{position:sticky;top:0;z-index:100;background:rgba(7,10,16,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.header-inner{max-width:1400px;margin:auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px}
.brand-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent2),var(--accent));font-size:23px;box-shadow:0 8px 25px rgba(53,224,161,.15)}
.brand-name{font-size:23px;font-weight:900;letter-spacing:.5px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:3px}
.search-wrap{position:relative;width:min(420px,100%);flex:1 1 260px}
.search{width:100%;background:#0b1018;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 44px 12px 40px;outline:none;font:inherit;font-size:14px}
.search::placeholder{color:#64748b}
.search:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(109,124,255,.12)}
.search-ico{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:15px}
.search-clear{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px;display:none}
.search-clear:hover{color:var(--text);background:rgba(255,255,255,.06)}
.search-wrap.filled .search-clear{display:block}

/* ---------- المنصات ---------- */
.platforms{display:flex;gap:6px;background:#0b1018;border:1px solid var(--line);border-radius:14px;padding:4px}
.plat-btn{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;font-weight:800;padding:9px 18px;border-radius:10px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;direction:ltr}
.plat-btn:hover{color:var(--text)}
.plat-btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#05070b}
.plat-btn small{font-weight:700;opacity:.75;margin-inline-start:4px}

/* ---------- شريط الأدوات ---------- */
.container{max-width:1400px;margin:auto;padding:26px 28px 70px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.toolbar h1{font-size:24px;margin:0;font-weight:900}
.count{color:var(--muted);font-size:13px;margin-top:5px}
.count b{color:var(--accent);font-weight:800}
.sorts{display:flex;gap:8px;background:#0b1018;border:1px solid var(--line);border-radius:12px;padding:4px}
.sort-btn{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
.sort-btn:hover{color:var(--text)}
.sort-btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#05070b}

/* ---------- الشبكة ---------- */
.game-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.game-card{
  position:relative;min-width:0;background:linear-gradient(180deg,#121925,#0d131c);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.game-card:hover{transform:translateY(-5px);border-color:rgba(109,124,255,.65);box-shadow:0 16px 35px rgba(0,0,0,.35)}
.game-cover{position:relative;aspect-ratio:1/1;background:#080c13;overflow:hidden}
.game-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.game-card:hover .game-cover img{transform:scale(1.045)}
.game-cover.no-img{display:grid;place-items:center;background:linear-gradient(135deg,#0d131c,#151d2b)}
.game-cover.no-img::after{content:"🎮";font-size:40px;opacity:.28}
.game-cover.no-img img{display:none}
/* unicode-bidi:plaintext => "7 Days To Die" ne devient pas "Days To Die 7" dans une page RTL */
.game-name{min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;padding:13px 15px;font-size:15px;font-weight:800;line-height:1.35;border-top:1px solid rgba(255,255,255,.05);unicode-bidi:plaintext}

/* شارات */
.badge{position:absolute;top:10px;font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.badge-size{inset-inline-start:10px;background:rgba(7,10,16,.78);border:1px solid var(--line);color:#cbd5e1}
.badge-new{inset-inline-end:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#05070b;box-shadow:0 4px 14px rgba(53,224,161,.35)}

/* ---------- لا نتائج ---------- */
.empty{display:none;text-align:center;padding:70px 20px;color:var(--muted)}
.empty.show{display:block}
.empty-ico{font-size:52px;opacity:.35;margin-bottom:14px}
.empty h2{color:var(--text);font-size:19px;margin:0 0 8px}
.empty p{margin:0;font-size:14px}

/* ---------- العودة للأعلى ---------- */
.to-top{
  position:fixed;inset-block-end:24px;inset-inline-start:24px;z-index:90;
  width:48px;height:48px;border:1px solid var(--line);border-radius:14px;cursor:pointer;
  background:rgba(13,18,27,.92);color:var(--text);font-size:20px;backdrop-filter:blur(10px);
  display:grid;place-items:center;opacity:0;visibility:hidden;transform:translateY(12px);
  transition:opacity .25s,transform .25s,visibility .25s,border-color .2s;
}
.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top:hover{border-color:var(--accent);color:var(--accent)}

.footer{max-width:1400px;margin:auto;padding:0 28px 40px;color:#667387;font-size:12px;text-align:center;line-height:1.8}

@media(max-width:1100px){.game-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){
  .header-inner{padding:13px 16px;gap:12px}
  .brand-name{font-size:18px}
  .platforms{order:2;width:100%}
  .plat-btn{flex:1;padding:9px 10px;font-size:13px}
  .search-wrap{flex-basis:100%;order:3}
  .container{padding:20px 16px 60px}
  .game-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
  .game-name{font-size:13px;min-height:52px;padding:10px}
  .toolbar h1{font-size:20px}
  .sort-btn{padding:7px 11px;font-size:12px}
  .to-top{inset-block-end:16px;inset-inline-start:16px;width:44px;height:44px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.badge-ar{
  inset-inline-end:10px;
  top:10px;
  background:rgba(7,10,16,.85);
  border:1px solid var(--accent);
  color:var(--accent);
}
.game-loc{flex-wrap:wrap;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px 11px;font-size:12px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.02);border-top:1px solid rgba(255,255,255,.05)}
.game-loc.none{opacity:.45}
.game-loc span{color:var(--accent2);direction:ltr;unicode-bidi:isolate;background:rgba(109,124,255,.12);padding:3px 9px;border-radius:999px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.loc-select{background:#0b1018;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 14px;font:inherit;font-size:13px;font-weight:700;outline:none;cursor:pointer;max-width:100%}
.loc-select:focus{border-color:var(--accent2)}
.only-ar{background:#0b1018;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.only-ar[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(53,224,161,.08)}

/* ---------- شعارات المنصات + تبويب PS5 ---------- */
.plat-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 10px}
.plat-btn{padding:6px 12px}
.plat-logo{height:50px;width:auto;display:block;border-radius:10px;object-fit:contain;font-size:12px;color:var(--text)}
.plat-logo-sq{width:50px;height:50px}
.plat-btn[aria-pressed="false"] .plat-logo{opacity:.9}
.plat-btn:hover .plat-logo{opacity:1}
.plat-btn small{font-size:11px}
.soon{text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#121925,#0d131c)}
.soon-logo{width:min(320px,70%);height:auto;border-radius:14px;margin-bottom:22px}
.soon h2{font-size:24px;margin:0 0 10px;font-weight:900;color:var(--accent)}
.soon p{margin:0;color:var(--muted);font-size:15px}
@media(max-width:720px){.plat-logo{height:42px}.plat-logo-sq{width:42px;height:42px}.plat-btn{padding:5px 6px}}

/* ---------- رقم الهاتف ---------- */
.call{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#05070b;font-weight:900;font-size:15px;text-decoration:none;padding:11px 18px;border-radius:12px;white-space:nowrap;direction:ltr;box-shadow:0 8px 22px rgba(53,224,161,.18)}
.call:hover{filter:brightness(1.08)}
.footer a{color:var(--accent);text-decoration:none;font-weight:800;direction:ltr;unicode-bidi:isolate}
@media(max-width:720px){.call{order:1;font-size:14px;padding:9px 13px}}

/* ---------- شعار المتجر ---------- */
.brand-logo{width:58px;height:58px;border-radius:50%;object-fit:cover;display:block;flex:none;box-shadow:0 8px 25px rgba(53,224,161,.15)}
.logo-txt{display:inline-grid;place-items:center;min-width:54px;height:40px;padding:0 12px;border-radius:10px;background:#0b1018;border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:900;direction:ltr}
.call-fab{display:none}

/* ---------- نسخة الهاتف ---------- */
@media(max-width:720px){
  .header{position:static}
  .header-inner{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px 14px;gap:10px}
  .brand{gap:10px;min-width:0}
  .brand-logo{width:46px;height:46px}
  .brand-icon{width:40px;height:40px;font-size:20px}
  .brand-name{font-size:17px}
  .brand-sub{font-size:10px}
  .call{display:none}
  .platforms{grid-column:1/-1;order:0;width:100%;justify-content:space-between}
  .plat-btn{flex:1;flex-direction:column;gap:2px;padding:6px 4px}
  .search-wrap{grid-column:1/-1;order:0;flex-basis:auto;width:100%}
  .search{font-size:16px;padding:13px 44px 13px 40px}
  .toolbar{gap:12px}
  .filters{width:100%;gap:8px}
  .sorts{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .sorts::-webkit-scrollbar{display:none}
  .sort-btn{flex:1;white-space:nowrap}
  .only-ar{flex:none}
  .loc-select{flex:1;min-width:0;font-size:14px}
  .game-card:hover{transform:none}
  .game-card:hover .game-cover img{transform:none}
  .badge{font-size:10px;padding:4px 8px;top:7px}
  .game-loc{font-size:11px;padding:7px 6px 9px}
  .soon{padding:40px 14px}
  .soon h2{font-size:20px}
  .footer{padding:0 16px calc(90px + env(safe-area-inset-bottom))}
  .call-fab{
    position:fixed;inset-block-end:calc(16px + env(safe-area-inset-bottom));inset-inline-end:16px;z-index:90;
    width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:23px;text-decoration:none;
    background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 8px 22px rgba(53,224,161,.35)
  }
}
@media(max-width:380px){
  .game-grid{gap:10px}
  .game-name{font-size:12px;padding:8px 6px}
  .brand-name{font-size:15px}
}
</style>
</head>

  {n:"The Legend of Zelda: Tears of the Kingdom", i:"The Legend of Zelda Tears of the Kingdom.jpg"},
  {n:"Yoshi's Crafted World", i:"Yoshi's Crafted World.nsp.jpg"}
];

/* ---- أدوات ---- */
const $ = id => document.getElementById(id);
const grid = $('grid'), empty = $('empty'), countEl = $('count'), searchEl = $('search');

// تطبيع النص: حروف صغيرة، بلا تشكيل ولا فواصل ولا رموز.
const norm = s => s.toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9\u0600-\u06ff]+/g,'');

// كلمات البحث، للعثور على النتيجة مهما كان ترتيب الكلمات
const words = s => s.toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9\u0600-\u06ff]+/g,' ')
  .trim().split(' ').filter(Boolean);

/* اختصارات البحث: الكلمة التي يكتبها الزبون -> الألعاب المعنية.
   لإضافة اختصار جديد، أضف سطراً هنا.                                        */
const ALIASES = [
  [/grand theft auto/i,            "gta قراند جاتا"],
  [/call of duty/i,                "cod كود كول اوف ديوتي"],
  [/\bfc\s?2\d|fifa/i,             "fifa فيفا"],
  [/need for speed/i,              "nfs نيد فور سبيد"],
  [/god of war/i,                  "gow جود اوف وور"],
  [/assassin/i,                    "ac اساسنز كريد"],
  [/mortal kombat/i,               "mk مورتال كومبات"],
  [/resident evil/i,               "re ريزيدنت ايفل"],
  [/spider-?man/i,                 "سبايدرمان سبايدر مان"],
  [/last of us/i,                  "tlou لاست اوف اس"],
  [/red dead/i,                    "rdr ريد ديد"],
  [/battlefield/i,                 "bf باتلفيلد"],
  [/street fighter/i,              "sf ستريت فايتر"],
  [/tekken/i,                      "تيكن"],
  [/minecraft/i,                   "ماين كرافت"],
  [/far cry/i,                     "فار كراي"],
  [/naruto/i,                      "ناروتو"],
  [/dragon ball/i,                 "dbz دراغون بول"],
  [/one piece/i,                   "ون بيس"],
  [/\bwwe\b/i,                     "مصارعة"],
  [/formula|\bf1\b/i,              "f1 فورمولا"],
  [/gran turismo/i,                "gt جران توريزمو"],
  [/watch dogs/i,                  "watchdogs ووتش دوقز"],
  [/uncharted/i,                   "انشارتد"],
  [/batman/i,                      "باتمان"],
  [/mario/i,                       "ماريو"],
  [/zelda/i,                       "زيلدا"],
  [/pokemon/i,                     "بوكيمون"],
  [/sonic/i,                       "سونيك"],
  [/\bps2\s?to\s?ps4|\[PS2toPS4\]/i, "ps2 بلايستيشن2"],
];

[...GAMES, ...SWITCH].forEach(g => {
  let k = norm(g.n) + norm((g.l||[]).map(x => x[0]).join(' '));
  if (g.ar) k += norm('arabe arabic') + 'عربية';
  for (const [re, extra] of ALIASES) if (re.test(g.n)) k += norm(extra);
  g._k = k;
});

// قائمة الأماكن PS4 (حسب ترتيب ظهورها في القائمة)
const LOCS = [...new Set(GAMES.flatMap(g => (g.l||[]).map(x => x[0])))];
// ترتيب "حسب القرص": رقم أول مكان للعبة
GAMES.forEach(g => { const f = g.l && g.l[0] ? LOCS.indexOf(g.l[0][0]) : -1; g.o = f < 0 ? 999 : f; });

// تطابق إذا وُجدت العبارة كاملة أو وُجدت كل كلمة على حدة
const matches = (g, q, qw) => g._k.includes(q) || qw.every(w => g._k.includes(w));

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- المنصات ---- */
const PLATFORMS = {
  ps4:    { list: GAMES,  title: 'ألعاب PS4',             sub: 'كتالوج ألعاب PS4' },
  switch: { list: SWITCH, title: 'ألعاب Nintendo Switch', sub: 'كتالوج ألعاب Nintendo Switch' }
};
let platform = 'ps4', sortMode = 'az', locFilter = '', onlyAr = false;

/* ---- الرسم ---- */
// صور بدون امتداد: يجرّب الموقع الامتدادات واحداً بعد الآخر
const EXT = ['.png','.jpg','.jpeg','.webp','.PNG','.JPG','.avif'];
const hasExt = f => /\.(png|jpe?g|webp|avif|gif)$/i.test(f);
function imgFail(el){
  const base = el.dataset.base;
  if (base){
    const n = +el.dataset.t || 0;
    if (n < EXT.length){ el.dataset.t = n + 1; el.src = './icon_games/' + base + EXT[n]; return; }
  }
  el.parentNode.classList.add('no-img');
}

function cardHTML(g){
  const cover = g.i
    ? (hasExt(g.i)
        ? `<div class="game-cover"><img src="./icon_games/${esc(g.i)}" alt="${esc(g.n)}" loading="lazy" decoding="async" onerror="imgFail(this)"></div>`
        : `<div class="game-cover"><img src="./icon_games/${esc(g.i)}${EXT[0]}" data-base="${esc(g.i)}" data-t="1" alt="${esc(g.n)}" loading="lazy" decoding="async" onerror="imgFail(this)"></div>`)
    : `<div class="game-cover no-img"></div>`;
  const isArabic = g.ar ? `<span class="badge badge-ar">عربية</span>` : '';
  const mixed = g.l && g.l.some(x => x[1]) && g.l.some(x => !x[1]);
  let loc = '';
  if (platform === 'ps4'){
    loc = g.l && g.l.length
      ? `<div class="game-loc">📀 ${g.l.map(x => `<span>${esc(x[0])}${mixed && x[1] ? ' · عربية' : ''}</span>`).join('')}</div>`
      : `<div class="game-loc none">📀 —</div>`;
  }
  return `<article class="game-card">${cover}${isArabic}<div class="game-name" dir="auto">${esc(g.n)}</div>${loc}</article>`;
}

const byName = (a,b) => a.n.localeCompare(b.n,'en',{sensitivity:'base'});

function render(){
  const all = PLATFORMS[platform].list;
  const q = norm(searchEl.value), qw = words(searchEl.value);
  let list = all.filter(g =>
    (!q || matches(g, q, qw)) && (!locFilter || (g.l||[]).some(x => x[0] === locFilter)) && (!onlyAr || g.ar));

  if (sortMode === 'ar')       list.sort((a,b) => (b.ar||0)-(a.ar||0) || byName(a,b));
  else if (sortMode === 'loc') list.sort((a,b) => a.o - b.o || byName(a,b));
  else                         list.sort(byName);

  grid.innerHTML = list.map(cardHTML).join('');
  empty.classList.toggle('show', list.length === 0);

  const filtered = q || locFilter || onlyAr;
  countEl.innerHTML = filtered
    ? `<b>${list.length}</b> نتيجة من أصل ${all.length} لعبة`
    : `<b>${all.length}</b> لعبة متوفّرة`;

  $('searchWrap').classList.toggle('filled', searchEl.value !== '');
}

/* ---- الأحداث ---- */
searchEl.addEventListener('input', render);
searchEl.addEventListener('keydown', e => { if(e.key === 'Escape'){ searchEl.value=''; render(); } });
$('searchClear').addEventListener('click', () => { searchEl.value=''; render(); searchEl.focus(); });

function setSort(mode){
  sortMode = mode;
  $('sortAz').setAttribute('aria-pressed',  mode === 'az');
  $('sortAr').setAttribute('aria-pressed',  mode === 'ar');
  $('sortLoc').setAttribute('aria-pressed', mode === 'loc');
  render();
}
$('sortAz').addEventListener('click',  () => setSort('az'));
$('sortAr').addEventListener('click',  () => setSort('ar'));
$('sortLoc').addEventListener('click', () => setSort('loc'));

$('onlyAr').addEventListener('click', () => {
  onlyAr = !onlyAr;
  $('onlyAr').setAttribute('aria-pressed', onlyAr);
  render();
});

// فلتر المكان (PS4)
const locSel = $('locSel');
locSel.innerHTML = '<option value="">📀 كل الأماكن</option>' +
  LOCS.map(l => `<option value="${esc(l)}">${esc(l)} (${GAMES.filter(g => (g.l||[]).some(x => x[0] === l)).length})</option>`).join('');
locSel.addEventListener('change', () => { locFilter = locSel.value; render(); });

// تبديل المنصة
function setPlatform(p){
  platform = p;
  $('platPs4').setAttribute('aria-pressed', p === 'ps4');
  $('platSw').setAttribute('aria-pressed',  p === 'switch');
  $('pageTitle').textContent = PLATFORMS[p].title;
  $('brandSub').textContent  = PLATFORMS[p].sub;
  document.querySelectorAll('.ps4-only').forEach(el => { el.hidden = (p !== 'ps4'); });
  // إعادة ضبط الفلاتر عند تغيير المنصة
  locFilter = ''; locSel.value = '';
  onlyAr = false; $('onlyAr').setAttribute('aria-pressed', false);
  setSort('az');
}
$('platPs4').addEventListener('click', () => setPlatform('ps4'));
$('platSw').addEventListener('click',  () => setPlatform('switch'));

// اختصار: اضغط "/" للبحث مباشرة
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
});

// العودة إلى الأعلى
const toTop = $('toTop');
addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > 600), {passive:true});
toTop.addEventListener('click', () => scrollTo({top:0, behavior:'smooth'}));

/* ---- الإقلاع ---- */
$('nPs4').textContent = '(' + GAMES.length + ')';
$('nSw').textContent  = '(' + SWITCH.length + ')';
$('footCount').textContent = 'PS4: ' + GAMES.length + ' لعبة • Nintendo Switch: ' + SWITCH.length + ' لعبة';
render();
</script>

<!-- احتياط الشعارات — سكربت منفصل، السكربت الأصلي لم يتغيّر -->
<script>
/* يجرّب امتدادات أخرى للشعار، وإن لم يوجد الملف يعرض بديلاً نصياً بدل الصورة المكسورة */
function logoFail(el){
  const exts = ['.png','.PNG','.jpg','.JPG','.jpeg','.webp'];
  const n = +el.dataset.t || 0;
  if (el.dataset.base && n < exts.length){
    el.dataset.t = n + 1;
    el.src = el.dataset.base + exts[n];
    return;
  }
  el.onerror = null;
  let sub;
  if (el.dataset.fb === 'icon'){
    sub = document.createElement('div');
    sub.className = 'brand-icon';
    sub.textContent = '🎮';
  } else if (el.classList.contains('soon-logo')){
    sub = document.createElement('span');
  } else {
    sub = document.createElement('span');
    sub.className = 'logo-txt';
    sub.textContent = el.alt;
  }
  el.replaceWith(sub);
}
</script>

<!-- تبويب PS5 (قريباً) — سكربت منفصل، السكربت الأصلي أعلاه لم يتغيّر -->
<script>
(function(){
  const $ = id => document.getElementById(id);
  const hideWhenSoon = ['grid','empty','count','searchWrap'].map($)
    .concat([document.querySelector('.filters')]);
  function setSoon(on){
    hideWhenSoon.forEach(el => { if (el) el.hidden = on; });
    $('soon').hidden = !on;
    $('platPs5').setAttribute('aria-pressed', on);
    if (on){
      $('platPs4').setAttribute('aria-pressed', false);
      $('platSw').setAttribute('aria-pressed', false);
      $('pageTitle').textContent = 'ألعاب PS5';
      $('brandSub').textContent  = 'ألعاب PS5 متوفرة قريباً';
    }
  }
  $('platPs5').addEventListener('click', () => setSoon(true));
  $('platPs4').addEventListener('click', () => setSoon(false));
  $('platSw').addEventListener('click',  () => setSoon(false));
})();
</script>
</body>
</html>
